[workspace]
resolver = "2"
members = [
   "crates/media-parser",
]

[package]
name = "tauri-plugin-media-parser"
version = "0.1.0"
description = "A Tauri plugin for parsing media files, including metadata, tracks, frames, and subtitles, currently supporting MP4 and MP3 formats."
license = "MIT"
edition = "2024"
rust-version = "1.94.0"
links = "tauri-plugin-media-parser"

[dependencies]
tauri = "2.5.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.18"
tokio = { version = "1.48.0", features = ["time"] }
url = "2.5.8"

[target.'cfg(target_os = "android")'.dependencies]
media-parser = { path = "crates/media-parser", default-features = false, features = ["thumbnails", "android-mediacodec"] }

[target.'cfg(target_os = "windows")'.dependencies]
media-parser = { path = "crates/media-parser", default-features = false, features = ["thumbnails", "windows-media-foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
media-parser = { path = "crates/media-parser", default-features = false, features = ["thumbnails", "apple-videotoolbox"] }

[target.'cfg(target_os = "ios")'.dependencies]
media-parser = { path = "crates/media-parser", default-features = false, features = ["thumbnails", "apple-videotoolbox"] }

[target.'cfg(not(any(target_os = "android", target_os = "windows", target_os = "macos", target_os = "ios")))'.dependencies]
media-parser = { path = "crates/media-parser", default-features = false }

[build-dependencies]
tauri-plugin = { version = "2.5.3", features = ["build"] }

[dev-dependencies]
tauri = { version = "2.5.1", features = ["test"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
