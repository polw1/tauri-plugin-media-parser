name: CI

on:
   push: # Runs on push to any branch
   pull_request:
      branches: [ "master" ]

env:
   CARGO_TERM_COLOR: always

jobs:
   ci:
      name: Continuous Integration
      runs-on: ubuntu-latest

      steps:
         - name: Checkout repository
           uses: actions/checkout@v4

         - name: Setup Node.js
           uses: actions/setup-node@v4
           with:
              node-version-file: '.nvmrc'
              cache: 'npm'

         - name: Install system dependencies
           run: |
              sudo apt-get update
              sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

         - name: Setup Rust toolchain
           uses: actions-rust-lang/setup-rust-toolchain@v1
           with:
              toolchain: '1.94.0'
              components: rustfmt, clippy
              cache: true

         - name: Install npm dependencies
           run: npm ci

         - name: Run standards checks
           run: npm run standards

         - name: Run cargo check
           run: cargo check --workspace --all-targets

         - name: Run cargo tests
           run: cargo test --workspace

   native-thumbnails:
      name: Native thumbnails (${{ matrix.os }})
      strategy:
         fail-fast: false
         matrix:
            include:
               - os: windows-latest
               - os: macos-latest
      runs-on: ${{ matrix.os }}
      steps:
         - name: Checkout repository
           uses: actions/checkout@v4
         - name: Setup Rust toolchain
           uses: actions-rust-lang/setup-rust-toolchain@v1
           with:
              toolchain: '1.94.0'
              components: clippy
              cache: true
         - name: Check metadata-only crate
           run: cargo check -p media-parser --all-targets
         - name: Check native plugin integration
           run: cargo check --workspace --all-targets
         - name: Lint native backend
           run: cargo clippy --workspace --all-targets -- -D warnings
         - name: Test native backend
           run: cargo test --workspace
         - name: Install iOS check target
           if: matrix.os == 'macos-latest'
           run: rustup target add aarch64-apple-ios
         - name: Check iOS backend
           if: matrix.os == 'macos-latest'
           run: cargo check -p media-parser --all-targets --target aarch64-apple-ios --features thumbnails,apple-videotoolbox
