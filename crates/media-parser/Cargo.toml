[package]
name = "media-parser"
version = "0.1.0"
description = "Async media parser utilities: metadata, tracks, frames, and subtitles over seekable file/HTTP streams."
edition = "2024"
rust-version = "1.94.0"

[features]
default = []
thumbnails = ["dep:jpeg-encoder"]
android-mediacodec = ["dep:ndk-sys"]
windows-media-foundation = ["dep:windows"]

[dependencies]
thiserror = "2.0.16"
async-trait = "0.1.89"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
bytes = "1.10.1"
futures = "0.3.31"
tracing = "0.1.44"
serde = { version = "1.0.228", features = ["derive"] }
jpeg-encoder = { version = "0.7.1", features = ["simd"], optional = true }

[target.'cfg(target_os = "android")'.dependencies]
ndk-sys = { version = "0.6.0", features = ["media"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", optional = true, features = [
   "Win32_Foundation",
   "Win32_Media_MediaFoundation",
   "Win32_System_Com",
] }

[dev-dependencies]
jpeg-decoder = { version = "0.3.1", default-features = false }
tempfile = "3.26.0"
wiremock = "0.6.5"
