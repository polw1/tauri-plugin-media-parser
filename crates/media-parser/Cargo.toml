[package]
name = "media-parser"
version = "0.1.0"
description = "Async media parser utilities: metadata, tracks, frames, and subtitles over seekable file/HTTP streams."
license = "MIT"
edition = "2024"
rust-version = "1.94.0"

[features]
default = []
thumbnails = ["dep:jpeg-encoder"]
android-mediacodec = ["dep:libc", "dep:ndk-sys"]
windows-media-foundation = ["dep:windows"]
apple-videotoolbox = [
   "dep:objc2-core-foundation",
   "dep:objc2-core-media",
   "dep:objc2-core-video",
   "dep:objc2-video-toolbox",
]

[dependencies]
thiserror = "2.0.16"
async-trait = "0.1.89"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync"] }
reqwest = { version = "0.13.2", features = ["stream"] }
webpki-root-certs = "1.0.8"
bytes = "1.10.1"
futures = "0.3.31"
tracing = "0.1.44"
serde = { version = "1.0.228", features = ["derive"] }
jpeg-encoder = { version = "0.7.1", features = ["simd"], optional = true }

[target.'cfg(target_os = "android")'.dependencies]
libc = { version = "0.2.189", optional = true }
ndk-sys = { version = "0.6.0", features = ["media"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", optional = true, features = [
   "Win32_Foundation",
   "Win32_Media_MediaFoundation",
   "Win32_System_Com",
   "Win32_System_LibraryLoader",
] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2-core-foundation = { version = "0.3.2", optional = true, default-features = false, features = [
   "std", "CFBase", "CFDictionary", "CFNumber", "CFString",
] }
objc2-core-media = { version = "0.3.2", optional = true, default-features = false, features = [
   "std", "CMBase", "CMBlockBuffer", "CMFormatDescription",
   "CMSampleBuffer", "CMTime",
] }
objc2-core-video = { version = "0.3.2", optional = true, default-features = false, features = [
   "std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn",
] }
objc2-video-toolbox = { version = "0.3.2", optional = true, default-features = false, features = [
   "std", "objc2-core-media", "objc2-core-video", "VTBase",
   "VTDecompressionProperties", "VTDecompressionSession", "VTErrors",
   "VTSession",
] }

[dev-dependencies]
jpeg-decoder = { version = "0.3.1", default-features = false }
tempfile = "3.26.0"
tokio = { version = "1.48.0", features = ["time"] }
wiremock = "0.6.5"
